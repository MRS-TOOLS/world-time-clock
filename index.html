<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="基準地域の日時から、世界各地の日時をまとめて比較できるツールです。">
  <title>世界時差比較 | MRS TOOLS</title>
  <link rel="stylesheet" href="style.css?v=20260930-5">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="brand">MRS TOOLS</p>
      <h1>世界時差比較</h1>
    </header>

    <section class="clock-panel" aria-label="世界時差比較">
      <label class="live-control" for="live-clock">
        <input id="live-clock" type="checkbox">
        <span>現在時刻に連動</span>
      </label>

      <p class="reference-label">基準地域</p>
      <div id="cards" class="cards" aria-live="polite"></div>

      <button id="add-card" class="add-button" type="button" aria-label="比較する地域を追加">
        <span aria-hidden="true">＋</span>
        <span>地域を追加</span>
      </button>

      <p class="drag-help">左端のハンドルをドラッグすると、基準地域と表示順を変更できます。</p>
    </section>
  </main>

  <div id="zone-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <button id="modal-back" class="icon-button modal-back" type="button" aria-label="国選択へ戻る" hidden>‹</button>
        <h2 id="modal-title">国を選択</h2>
        <button id="modal-close" class="icon-button" type="button" aria-label="閉じる">×</button>
      </header>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="zone-search" type="search" inputmode="search" autocomplete="off" placeholder="国名・都市名で検索" aria-label="国や地域を検索">
      </div>

      <p id="modal-guide" class="modal-guide">国を選んでください</p>
      <div id="zone-list" class="zone-list" role="list"></div>
      <p id="zone-empty" class="empty-message" hidden>一致する国・地域がありません。</p>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="timezones.js"></script>
  <script src="script.js?v=20260930-5"></script>
</body>
</html>
